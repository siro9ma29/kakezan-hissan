<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マス・モンスターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: 縦1列。上＝夜の戦場（濃紺パネル）、中＝方眼ノートのひっ算、下＝テンキー。単一テーマで設計 */
:root{
  --night:#1b2142; --night-2:#323d82; --night-ink:#10142b; --star:#c9d3ff;
  --paper:#f2f7f6; --cell-line:#d3e4e8; --rule:#8db1bc; --ink:#1d2a36; --muted:#5d6e7b;
  --gold:#ffc83d; --gold-deep:#b77f00; --carry:#e0457c; --carry-soft:#fde6ef;
  --focus:#2f6df6; --focus-soft:#e2ebff; --ok:#1c9a57; --ok-soft:#dcf4e6; --bad:#d8334a;
  --hp:#47d27c; --key:#ffffff; --key-edge:#bccdd4; --white:#ffffff;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  --f-pixel:"DotGothic16","M PLUS Rounded 1c","MS Gothic",monospace;
  --c:clamp(50px,14.5vw,66px);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}

/* ---------- バトルエリア ---------- */
.battle{background:radial-gradient(ellipse 80% 60% at 50% 62%,var(--night-2) 0%,var(--night) 72%);
  color:var(--white);border-radius:18px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;
  box-shadow:0 6px 0 var(--night-ink)}
.topbar{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-pixel)}
.logo{color:var(--gold);font-size:18px;letter-spacing:.06em}
.kills{font-size:14px;color:var(--star)}
.enemy{display:flex;align-items:center;gap:10px}
.enemy-name{font-family:var(--f-pixel);font-size:16px;white-space:nowrap}
.hpbar{flex:1;height:16px;border:2px solid var(--white);border-radius:6px;background:var(--night-ink);position:relative;overflow:hidden}
.hpfill{height:100%;width:100%;background:var(--hp);transition:width .6s ease,background-color .3s}
.hpfill.mid{background:var(--gold)} .hpfill.low{background:var(--bad)}
.hptext{font-family:var(--f-pixel);font-size:13px;min-width:4.6em;text-align:right;font-variant-numeric:tabular-nums}
.stage{position:relative;height:150px;display:grid;place-items:center}
.stage::after{content:"";position:absolute;bottom:10px;left:50%;width:200px;height:18px;transform:translateX(-50%);
  border-radius:50%;background:var(--night-ink);opacity:.55}
.monster{width:132px;position:relative;z-index:1;animation:bob 2.4s ease-in-out infinite}
.monster svg{display:block;width:100%;height:auto}
.monster.hit{animation:hit .55s steps(1) 1,shake .45s ease 1}
.monster.down{animation:down 1s ease forwards}
.monster.appear{animation:appear .6s ease-out}
.dmg{position:absolute;top:18px;left:50%;z-index:3;font-family:var(--f-pixel);font-size:34px;color:var(--gold);
  text-shadow:0 3px 0 var(--night-ink);opacity:0;pointer-events:none;transform:translateX(-50%)}
.dmg.show{animation:pop 1.1s ease-out forwards}
.slash{position:absolute;z-index:2;width:190px;height:6px;border-radius:3px;background:var(--white);
  box-shadow:0 0 14px var(--gold);transform:rotate(-32deg) scaleX(0);opacity:0}
.slash.show{animation:slash .35s ease-out forwards}
.msg{font-family:var(--f-pixel);font-size:16px;line-height:1.65;background:var(--night-ink);border:3px solid var(--white);
  border-radius:8px;padding:10px 14px;min-height:calc(1.65em * 2 + 20px)}
.msg.fresh{animation:fade .25s ease-out}
.msg.good{border-color:var(--gold)}
.msg.hint{border-color:#ff9db8}

@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hit{0%,40%,80%{filter:brightness(2.4) saturate(.2)}20%,60%,100%{filter:none}}
@keyframes shake{0%,100%{translate:0}20%{translate:-10px}40%{translate:10px}60%{translate:-6px}80%{translate:6px}}
@keyframes down{to{opacity:0;transform:translateY(24px) scaleY(.4)}}
@keyframes appear{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
@keyframes slash{0%{opacity:1;transform:rotate(-32deg) scaleX(0)}60%{opacity:1;transform:rotate(-32deg) scaleX(1)}100%{opacity:0;transform:rotate(-32deg) scaleX(1)}}
@keyframes fade{from{opacity:.2}to{opacity:1}}
@keyframes ng{0%,100%{translate:0}25%{translate:-5px}75%{translate:5px}}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--carry-soft)}}

/* ---------- ひっ算エリア ---------- */
.sheet{background:var(--white);border:2px solid var(--cell-line);border-radius:16px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps li{display:flex;align-items:center;gap:6px;justify-content:center;font-size:13px;font-weight:800;color:var(--muted);
  background:var(--paper);border-radius:999px;padding:5px 6px;white-space:nowrap}
.steps li b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--cell-line);color:var(--ink);font-size:12px}
.steps li.now{background:var(--focus-soft);color:var(--focus)} .steps li.now b{background:var(--focus);color:var(--white)}
.steps li.done{background:var(--ok-soft);color:var(--ok)} .steps li.done b{background:var(--ok);color:var(--white)}
.goal{font-size:15px;line-height:1.6;text-wrap:balance;text-align:center;font-weight:800;margin:0}
.goal em{font-style:normal;color:var(--carry)}
.work{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.hissan{display:grid;grid-template-columns:calc(var(--c)*.7) repeat(3,var(--c));
  grid-template-rows:24px calc(var(--c)*.78) var(--c) var(--c) var(--c);font-variant-numeric:tabular-nums}
.cell{position:relative;display:grid;place-items:center;transition:background-color .25s}
.cell.col-h,.cell.col-t,.cell.col-o{border-left:2px solid var(--cell-line)}
.cell.col-o{border-right:2px solid var(--cell-line)}
.cell.focus{background:var(--focus-soft)}
.cell.under{border-bottom:4px solid var(--ink)}
.pl{font-size:12px;font-weight:800;color:var(--muted)}
.num{font-size:calc(var(--c)*.62);font-weight:800;line-height:1}
.num.use{color:var(--focus)}
.num.op{font-size:calc(var(--c)*.5);color:var(--muted)}
.carry-tag{font-size:11px;font-weight:800;color:var(--carry);line-height:1.25;text-align:right;justify-self:end;padding-right:4px}
.carry-tag::after{content:" →"}

.slot{border:3px dashed var(--muted);background:var(--white);color:var(--ink);font-weight:800;padding:0;transition:border-color .2s,background-color .2s}
.ans{width:calc(100% - 10px);height:calc(100% - 10px);border-radius:10px;font-size:calc(var(--c)*.6)}
.carry{width:calc(var(--c)*.62);height:calc(var(--c)*.62);border-radius:50%;border-color:var(--carry);color:var(--carry);
  font-size:calc(var(--c)*.4);align-self:end;margin-bottom:4px}
.slot.active{border-style:solid;border-color:var(--focus);box-shadow:0 0 0 4px var(--focus-soft)}
.carry.active{border-color:var(--carry);box-shadow:0 0 0 4px var(--carry-soft)}
.carry.filled{background:var(--carry);color:var(--white);border-style:solid}
.carry.pulse{animation:pulse 1.2s ease-in-out infinite}
.slot.wait{border-color:var(--cell-line);background:transparent}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.carry.ok{background:var(--carry);color:var(--white);border-color:var(--carry)}
.slot.ng{animation:ng .3s ease 2;border-color:var(--bad)!important}
.slot:disabled{cursor:default}

.memo{min-width:0;font-size:14px;line-height:1.7;color:var(--muted);margin:0;padding:8px 12px;border-left:3px solid var(--rule);font-variant-numeric:tabular-nums}
.memo h2{font-size:12px;margin:0;letter-spacing:.08em;color:var(--rule)}
.memo ol{margin:0;padding:0;list-style:none}
.memo li{color:var(--ink);font-weight:800}

/* ---------- 入力エリア ---------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;grid-auto-rows:56px;gap:8px}
.key{border:2px solid var(--key-edge);border-radius:12px;background:var(--key);color:var(--ink);font-size:26px;font-weight:800;
  box-shadow:0 4px 0 var(--key-edge);transition:transform .05s,box-shadow .05s}
.key:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--key-edge)}
.key:disabled{opacity:.4;cursor:default}
.key.zero{grid-column:1 / 4}
.key.erase{font-size:17px;color:var(--bad);border-color:#efc2ca;box-shadow:0 4px 0 #efc2ca}
.key.ok{grid-column:4;grid-row:2 / 5;background:var(--focus);color:var(--white);border-color:#1f4fbf;box-shadow:0 4px 0 #1f4fbf;font-size:20px}
.attack{height:62px;border:3px solid var(--gold-deep);border-radius:14px;background:var(--gold);color:var(--night);
  font-family:var(--f-pixel);font-size:26px;letter-spacing:.1em;box-shadow:0 5px 0 var(--gold-deep)}
.attack:disabled{background:var(--paper);border-color:var(--cell-line);color:var(--muted);box-shadow:0 5px 0 var(--cell-line);cursor:default;font-size:20px}
.attack.ready{animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{transform:translateY(-3px)}}

@media (prefers-reduced-motion:reduce){
  .monster,.attack.ready,.carry.pulse{animation:none}
  .monster.hit{animation:hit .55s steps(1) 1}
}
</style>
</head>
<body>

<div class="app">
  <section class="battle" aria-label="バトル">
    <div class="topbar"><span class="logo">マス・モンスターズ</span><span class="kills" id="kills">たおした数 0</span></div>
    <div class="enemy">
      <span class="enemy-name" id="enemyName"></span>
      <div class="hpbar" role="progressbar" aria-label="モンスターのHP" id="hpBar"><div class="hpfill" id="hpFill"></div></div>
      <span class="hptext" id="hpText"></span>
    </div>
    <div class="stage">
      <div class="monster" id="monster"></div>
      <div class="slash" id="slash"></div>
      <div class="dmg" id="dmg"></div>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <section class="sheet" aria-label="ひっ算">
    <ol class="steps" id="steps">
      <li data-s="1"><b>1</b>一のくらい</li>
      <li data-s="2"><b>2</b>十のくらい</li>
      <li data-s="3"><b>3</b>こうげき</li>
    </ol>
    <p class="goal" id="goal"></p>
    <div class="work">
      <div class="hissan" id="hissan"></div>
      <div class="memo"><h2>けいさんメモ</h2><ol id="memo"></ol></div>
    </div>
  </section>

  <section class="pad" aria-label="すうじ入力">
    <button class="key" data-d="7">7</button><button class="key" data-d="8">8</button><button class="key" data-d="9">9</button>
    <button class="key erase" id="erase">けす</button>
    <button class="key" data-d="4">4</button><button class="key" data-d="5">5</button><button class="key" data-d="6">6</button>
    <button class="key ok" id="ok">けってい</button>
    <button class="key" data-d="1">1</button><button class="key" data-d="2">2</button><button class="key" data-d="3">3</button>
    <button class="key zero" data-d="0">0</button>
  </section>
  <button class="attack" id="attack" disabled>こうげき！</button>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));

  const MONSTERS = [
    {name:'カケスライム', color:'#5cc8ec', hp:100},
    {name:'クリアゲドン', color:'#a184f0', hp:120, horns:true},
    {name:'ヒッサンキング', color:'#f3a33f', hp:150, crown:true}
  ];

  function monsterSVG(m){
    const ink = '#1b2142';
    const horns = m.horns ? `<path d="M40 40 L30 12 L52 30Z M80 40 L90 12 L68 30Z" fill="#fff4d6" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>` : '';
    const crown = m.crown ? `<path d="M42 24 L45 2 L54 15 L60 -4 L66 15 L75 2 L78 24Z" fill="#ffd84a" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>` : '';
    return `<svg viewBox="0 -8 120 116" aria-hidden="true">
      ${horns}
      <path d="M60 6 C70 30 104 48 104 74 C104 93 86 100 60 100 C34 100 16 93 16 74 C16 48 50 30 60 6Z" fill="${m.color}" stroke="${ink}" stroke-width="3.5"/>
      <ellipse cx="38" cy="60" rx="7" ry="11" fill="#ffffff" opacity=".45" transform="rotate(25 38 60)"/>
      <path d="M54 44 L66 56 M66 44 L54 56" stroke="${ink}" stroke-width="4" stroke-linecap="round" opacity=".5"/>
      <ellipse cx="47" cy="72" rx="8" ry="10" fill="#ffffff" stroke="${ink}" stroke-width="2.5"/>
      <ellipse cx="73" cy="72" rx="8" ry="10" fill="#ffffff" stroke="${ink}" stroke-width="2.5"/>
      <circle cx="49" cy="74" r="4" fill="${ink}"/><circle cx="71" cy="74" r="4" fill="${ink}"/>
      <path d="M51 88 Q60 95 69 88" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>
      ${crown}
    </svg>`;
  }

  // ---------- 状態 ----------
  const S = { mi:0, hp:MONSTERS[0].hp, defeated:0, busy:false };

  // 2けた×1けた（一のくらいで必ずくり上がる）の問題を作る
  // 2けた×2けたを足すときは、ここに別の生成関数とステップ定義を追加する
  function newProblem(){
    let t,o,b;
    do { t = rand(1,9); o = rand(2,9); b = rand(2,9); } while (o*b < 10);
    const p1 = o*b, c = Math.floor(p1/10), d1 = p1 % 10, tb = t*b;
    Object.assign(S, { t,o,b,p1,c,d1,tb, top:tb+c, answer:(10*t+o)*b,
      step:1, ones:'', carry:'', upper:'', active:'carry', clearNext:false, miss:[0,0], missTotal:0 });
    render();
  }

  // ---------- 表示 ----------
  function render(){
    const {t,o,b,step} = S;
    const focus = step===1 ? 'o' : step===2 ? 't' : '';
    const up = S.upper;
    const hD = up.length===2 ? up[0] : '';
    const tD = up.length===2 ? up[1] : up;

    const cls = name => {
      let c = 'slot';
      if (name==='ones' || name==='carry'){
        if (step>1) c += ' ok';
        else if (S.active===name) c += ' active';
      } else {
        if (step<2) c += ' wait';
        else if (step===2) c += ' active';
        else c += ' ok';
      }
      if (name==='carry'){
        if (S.carry!=='' && step===1) c += ' filled';
        if (step===2) c += ' pulse';
      }
      return c;
    };
    const L = (col, inner, extra='') => `<div class="cell col-${col}${focus===col?' focus':''}${extra?' '+extra:''}">${inner}</div>`;

    $('hissan').innerHTML =
      L('x','') + L('h','<span class="pl">百</span>') + L('t','<span class="pl">十</span>') + L('o','<span class="pl">一</span>') +
      L('x','') + L('h','<span class="carry-tag">くり<br>上がり</span>') +
        L('t', `<button class="carry ${cls('carry')}" data-slot="carry" aria-label="くり上がりのメモ" ${step!==1?'disabled':''}>${S.carry}</button>`) + L('o','') +
      L('x','') + L('h','') + L('t',`<span class="num">${t}</span>`) + L('o',`<span class="num">${o}</span>`) +
      L('x','<span class="num op">×</span>','under') + L('h','','under') + L('t','','under') +
        L('o',`<span class="num${step<3?' use':''}">${b}</span>`,'under') +
      L('x','') +
        L('h', `<button class="ans ${cls('upper')}" data-slot="upper" aria-label="答えの百のくらい" ${step!==2?'disabled':''}>${hD}</button>`) +
        L('t', `<button class="ans ${cls('upper')}" data-slot="upper" aria-label="答えの十のくらい" ${step!==2?'disabled':''}>${tD}</button>`) +
        L('o', `<button class="ans ${cls('ones')}" data-slot="ones" aria-label="答えの一のくらい" ${step!==1?'disabled':''}>${S.ones}</button>`);

    document.querySelectorAll('#steps li').forEach(li => {
      const s = +li.dataset.s;
      li.className = s < step ? 'done' : s === step ? 'now' : '';
    });

    $('goal').innerHTML =
      step===1 ? `${o} × ${b} の答えを、<em>くり上がり</em>（ピンクのわく）→ 下のマス の じゅんに入れよう` :
      step===2 ? `${t} × ${b} に、<em>くり上がりの ${S.c}</em> をたした数を入れよう` :
                 `${10*t+o} × ${b} = ${S.answer}　こうげきの じゅんびOK！`;

    let memo = '';
    if (step>=2) memo += `<li>${o} × ${b} = ${S.p1}</li>`;
    if (step>=3) memo += `<li>${t} × ${b} = ${S.tb}</li><li>${S.tb} ＋ ${S.c} = ${S.top}</li>`;
    $('memo').innerHTML = memo || '<li style="color:var(--muted);font-weight:500">とけた けいさんが<br>ここに のこるよ</li>';

    document.querySelectorAll('.key').forEach(k => k.disabled = step===3 || S.busy);
    const atk = $('attack');
    atk.disabled = step!==3 || S.busy;
    atk.classList.toggle('ready', step===3 && !S.busy);
    atk.textContent = step===3 ? 'こうげき！' : 'ひっ算を とくと こうげきできる';
  }

  function renderBattle(newMonster){
    const m = MONSTERS[S.mi];
    $('enemyName').textContent = m.name;
    $('hpText').textContent = `${S.hp}/${m.hp}`;
    const r = S.hp / m.hp;
    const f = $('hpFill');
    f.style.width = (r*100) + '%';
    f.className = 'hpfill' + (r <= .3 ? ' low' : r <= .6 ? ' mid' : '');
    $('hpBar').setAttribute('aria-valuenow', S.hp);
    $('kills').textContent = `たおした数 ${S.defeated}`;
    if (newMonster){
      const el = $('monster');
      el.className = 'monster';
      el.innerHTML = monsterSVG(m);
      restart(el, 'appear');
    }
  }

  function say(text, tone){
    const el = $('msg');
    el.textContent = text;
    el.className = 'msg' + (tone ? ' ' + tone : '');
    restart(el, 'fresh');
  }
  function restart(el, c){ el.classList.remove(c); void el.offsetWidth; el.classList.add(c); }
  function flash(name){
    document.querySelectorAll(`[data-slot="${name}"]`).forEach(e => restart(e, 'ng'));
  }

  // ---------- 入力 ----------
  function press(d){
    if (S.busy) return;
    if (S.step===1){
      // 九九の答え（例 5×6=30）を「3 → 0」と書く順に入力できる。逆の順でもOK
      S[S.active] = String(d);
      if (S.active==='carry' && S.ones==='') S.active = 'ones';
      else if (S.active==='ones' && S.carry==='') S.active = 'carry';
    } else if (S.step===2){
      if (S.clearNext || S.upper.length>=2){ S.upper=''; S.clearNext=false; }
      S.upper += d;
    }
    render();
  }
  function erase(){
    if (S.busy) return;
    if (S.step===1){
      if (S[S.active]!=='') S[S.active]='';
      else { S.active = S.active==='ones' ? 'carry' : 'ones'; S[S.active]=''; }
    } else if (S.step===2){
      S.upper = S.upper.slice(0,-1); S.clearNext=false;
    }
    render();
  }

  // ---------- ステップごとの正誤判定とヒント ----------
  function check(){
    if (S.busy) return;
    const {t,o,b,p1,c,d1,tb,top} = S;

    if (S.step===1){
      if (S.ones==='' && S.carry===''){ S.active='carry'; render(); say(`${o}×${b} の答えの 十のくらいの数から、ピンクのわくに 入れてね。`, 'hint'); flash('carry'); return; }
      if (S.ones===''){ S.active='ones'; render(); say('つぎは 答えの 一のくらいの数を、下のマスに 入れてね。', 'hint'); flash('ones'); return; }
      const okO = +S.ones===d1;
      const okC = S.carry!=='' && +S.carry===c;
      if (okO && okC){
        S.step=2; S.active='upper'; render();
        say(`せいかい！ ${o}×${b}=${p1}。下に ${d1}、くり上がりに ${c}。つぎは 十のくらいだ！`, 'good');
        return;
      }
      const m = ++S.miss[0]; S.missTotal++;
      if (!okO && +S.ones===c && S.carry!=='' && +S.carry===d1){
        render(); say('九九は 合っているよ！ でも 入れる場所が 反対だよ。下のマスには 一のくらいの数を 入れよう。', 'hint');
        flash('ones'); flash('carry'); return;
      }
      if (okO){
        S.active='carry'; render();
        if (m>=3) say(`一のくらいは 合っているよ！ ${o}×${b}=${p1} だから、くり上がりは ${c} だよ。`, 'hint');
        else if (S.carry==='') say(`一のくらいは 合っているよ！ ${o}×${b} の答えの 十のくらいの数を、ピンクのわくに メモしよう。`, 'hint');
        else say(`一のくらいは 合っているよ！ くり上がりは ${o}×${b} の答えの 十のくらいの数だよ。`, 'hint');
        flash('carry'); return;
      }
      S.active = okC ? 'ones' : 'carry'; render();
      if (m===1) say(`${o}×${b} の 九九を もう一度 となえてみよう。（${o}のだん）`, 'hint');
      else if (m===2) say(`${o}×${b} の答えは 2けたに なるよ。下のマスには 一のくらいの数だけを 書こう。`, 'hint');
      else say(`${o}×${b}=${p1}。下のマスに ${d1}、くり上がりに ${c} だよ。`, 'hint');
      flash('ones');
      return;
    }

    if (S.step===2){
      if (S.upper===''){ say('十のくらいの マスに 数を 入れてね。', 'hint'); flash('upper'); return; }
      const v = +S.upper;
      if (v===top){
        S.step=3; render();
        say(`${t}×${b}=${tb}、${tb}＋${c}=${top}。かんぺき！「こうげき！」を おそう！`, 'good');
        return;
      }
      const m = ++S.miss[1]; S.missTotal++; S.clearNext = true;
      render();
      if (m>=3) say(`${t}×${b}=${tb}、${tb}＋${c}=${top}。${top} を 入れよう。`, 'hint');
      else if (v===tb) say(`九九は 合っているよ！ くり上がりの ${c} を たすのを わすれていないかな？`, 'hint');
      else if (top>=10 && v===top%10) say('おしい！ 答えが 2けたに なったら、百のくらいまで そのまま 書くよ。', 'hint');
      else if (Math.abs(v-top)<=2) say(`おしい！ ${t}×${b} の答えに ${c} を たす 計算を もう一度 たしかめよう。`, 'hint');
      else if (m===1) say(`十のくらいの 九九、${t}×${b} を もう一度 たしかめよう。（${t}のだん）`, 'hint');
      else say(`${t}×${b}=${tb} だよ。それに くり上がりの ${c} を たそう。`, 'hint');
      flash('upper');
      return;
    }

    say('「こうげき！」ボタンを おそう！', 'good');
  }

  // ---------- こうげき ----------
  function attack(){
    if (S.step!==3 || S.busy) return;
    S.busy = true; render();
    const m = MONSTERS[S.mi];
    const crit = S.missTotal===0;
    const dmg = crit ? 30 : S.missTotal<=2 ? 20 : 15;
    S.hp = Math.max(0, S.hp - dmg);

    restart($('slash'), 'show');
    setTimeout(() => {
      restart($('monster'), 'hit');
      const d = $('dmg'); d.textContent = '-' + dmg; restart(d, 'show');
      renderBattle(false);
      say(crit ? `かいしんの いちげき！ ${m.name}に ${dmg}の ダメージ！` : `${m.name}に ${dmg}の ダメージ！`, 'good');
    }, 200);

    setTimeout(() => {
      if (S.hp===0){
        S.defeated++;
        $('monster').className = 'monster down';
        renderBattle(false);
        say(`${m.name}を たおした！`, 'good');
        setTimeout(() => {
          S.mi = (S.mi+1) % MONSTERS.length;
          S.hp = MONSTERS[S.mi].hp;
          renderBattle(true);
          S.busy = false; newProblem();
          say(`${MONSTERS[S.mi].name}が あらわれた！ ${10*S.t+S.o}×${S.b} を といて こうげきしよう。`);
        }, 1800);
      } else {
        S.busy = false; newProblem();
        say(`つぎの もんだいだ！ ${10*S.t+S.o}×${S.b} を とこう。`);
      }
    }, 1500);
  }

  // ---------- イベント ----------
  document.querySelectorAll('[data-d]').forEach(k => k.addEventListener('click', () => press(+k.dataset.d)));
  $('erase').addEventListener('click', erase);
  $('ok').addEventListener('click', check);
  $('attack').addEventListener('click', attack);
  $('hissan').addEventListener('click', e => {
    const s = e.target.closest('[data-slot]');
    if (!s || S.step!==1) return;
    if (s.dataset.slot==='ones' || s.dataset.slot==='carry'){ S.active = s.dataset.slot; render(); }
  });
  document.addEventListener('keydown', e => {
    if (/^[0-9]$/.test(e.key)) { press(+e.key); e.preventDefault(); }
    else if (e.key==='Backspace' || e.key==='Delete') { erase(); e.preventDefault(); }
    else if (e.key==='Enter') { (S.step===3 ? attack : check)(); e.preventDefault(); }
  });

  // ---------- スタート ----------
  renderBattle(true);
  newProblem();
  say(`${MONSTERS[0].name}が あらわれた！ ${10*S.t+S.o}×${S.b} を といて こうげきしよう。`);
})();
</script>
</body>
</html>
